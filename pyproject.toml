[project]
name = "pbip-model-migrator"
version = "0.1.0"
description = "Refactor Power BI PBIP semantic models by remapping tables and columns across reports."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
gui = ["PySide6"]

[project.scripts]
pbip-migrator-gui = "pbip_model_migrator.gui.app:main"
pbip-migrate = "pbip_model_migrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
